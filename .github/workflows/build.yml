name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore urlshortener.sln

      - name: Build
        run: dotnet build urlshortener.sln --no-restore --configuration Release

      - name: Test
        # Auth__ApiKey is required for the WebApplicationFactory to start correctly.
        # Testcontainers spins up a real Postgres container for integration tests;
        # Docker is available by default on ubuntu-latest GitHub Actions runners.
        env:
          Auth__ApiKey: ci-dummy-api-key
          TESTCONTAINERS_RYUK_DISABLED: "false"
        run: dotnet test urlshortener.sln --no-build --configuration Release --verbosity normal

      - name: Build Docker image
        run: docker build -t urlshortener:ci .
