services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: urlshortener
      POSTGRES_PASSWORD: urlshortener
      POSTGRES_DB: urlshortener
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U urlshortener"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "5001:5000"
    environment:
      PORT: "5000"
      DATABASE_URL: "postgres://urlshortener:urlshortener@db:5432/urlshortener"
      AUTH__APIKEY: "changeme-for-local-dev"
      APP__SHORTURLDOMAIN: "http://localhost:5000"
      ASPNETCORE_ENVIRONMENT: "Development"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
